name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    name: Bouwen, controleren en testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Opmaak
        run: |
          ongeformatteerd="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$ongeformatteerd" ]; then
            echo "Niet met gofmt geformatteerd:"
            echo "$ongeformatteerd"
            exit 1
          fi

      - name: Bouwen
        run: go build ./...

      - name: Statische controle
        run: go vet ./...

      - name: Testen
        run: go test ./...

      - name: Geen mermaid-cli op deze machine
        run: |
          if command -v mmdc >/dev/null 2>&1; then
            echo "mmdc staat onverwacht op het PATH; de suite hoort zonder te draaien" >&2
            exit 1
          fi
          go test -count=1 ./internal/mermaid/
